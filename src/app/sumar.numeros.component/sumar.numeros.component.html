<h1>Sumar Numeros Reference Form</h1>
<form #sumarform="ngForm" (ngSubmit)="sumarNumeros()">
    <label>Número 1:</label>
    <input type="number" #cajanumero1/><br/>

    <label>Número 2:</label>
    <input type="number" #cajanumero2/><br/>

    <button>Sumar</button>
</form>

<h2 style="color: blue;">La suma es {{suma}}</h2>
